<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo</title>

  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background:#0f1115; color:#fff; }
    .hidden { display:none!important; }

    .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .login-card { width:100%; max-width:430px; background:#1c1d22; border:1px solid #30323a; border-radius:18px; padding:24px; }

    .layout { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
    .sidebar { background:#15161b; border-right:1px solid #30323a; padding:18px; height:100vh; position:sticky; top:0; overflow-y:auto; }
    .main { padding:18px; overflow-x:hidden; }

    .brand { font-size:22px; font-weight:800; margin-bottom:4px; }
    .small { color:#98a2b3; font-size:13px; }
    .card { background:#1c1d22; border:1px solid #30323a; border-radius:14px; padding:18px; margin-bottom:16px; }

    h1,h2,h3,h4 { margin-top:0; }
    input,select,textarea,button { width:100%; padding:11px; border-radius:8px; border:none; margin:5px 0 10px; font-size:14px; }
    input,select,textarea { background:#fff; color:#111; }
    textarea { min-height:80px; resize:vertical; }
    button { cursor:pointer; font-weight:bold; background:#e8e8e8; color:#111; }

    .primary { background:#4c6fff; color:#fff; }
    .success { background:#12b76a; color:#fff; }
    .danger { background:#f04438; color:#fff; }
    .secondary { background:#667085; color:#fff; }
    .warning { background:#fdb022; color:#111; }

    .nav-btn { background:transparent; color:#d0d5dd; text-align:left; border:1px solid transparent; margin:4px 0; }
    .nav-btn:hover,.nav-btn.active { background:#232631; border-color:#3b3f4a; color:#fff; }

    .badge { display:inline-block; padding:7px 10px; border-radius:999px; background:#2d2e35; margin:4px 4px 4px 0; font-size:13px; }
    .badge-ok { background:#123322; color:#b7f7cf; }
    .badge-warn { background:#3d2d10; color:#ffe0a3; }
    .badge-danger { background:#3a1717; color:#ffd0d0; }

    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
    .row { display:flex; flex-wrap:wrap; gap:8px; }
    .row button { flex:1; min-width:140px; }

    .msg { color:#d0d5dd; white-space:pre-wrap; font-size:14px; }
    .okBox { background:#123322; border-left:5px solid #12b76a; padding:12px; border-radius:10px; margin-top:10px; }
    .errBox { background:#3a1717; border-left:5px solid #f04438; padding:12px; border-radius:10px; margin-top:10px; }

    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th,td { border-bottom:1px solid #333640; padding:9px; text-align:left; vertical-align:top; font-size:13px; }
    th { background:#252731; position:sticky; top:0; z-index:1; }
    tr:hover { background:#22242c; }
    .miniBtn { padding:7px; font-size:12px; margin:2px 0; }

    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
    .stat { background:#232631; border:1px solid #343844; border-radius:14px; padding:16px; }
    .stat-num { font-size:30px; font-weight:800; }

    @media(max-width:850px){
      .layout{grid-template-columns:1fr;}
      .sidebar{position:relative;height:auto;}
      th,td{font-size:11px;padding:6px;}
    }
  </style>
</head>

<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <h1>Panel Administrativo</h1>
    <p class="small">Ingreso ADMIN / ENCARGADO</p>

    <label>Usuario</label>
    <input id="loginUsuario" placeholder="admin">

    <label>Clave</label>
    <input id="loginClave" type="password" placeholder="clave">

    <button class="primary" onclick="login()">Ingresar</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="appView" class="layout hidden">

  <aside class="sidebar">
    <div class="brand">CORE Admin</div>
    <div class="small">Administración general</div>

    <div class="card" style="margin-top:14px;">
      <div id="adminBox"></div>
      <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <button id="navDashboard" class="nav-btn active" onclick="mostrarVista('dashboard')">📊 Dashboard</button>
    <button id="navSolicitudes" class="nav-btn" onclick="mostrarVista('solicitudes')">📋 Solicitudes</button>
    <button id="navOperadores" class="nav-btn" onclick="mostrarVista('operadores')">👤 Operadores</button>
    <button id="navBilleteras" class="nav-btn" onclick="mostrarVista('billeteras')">💳 Billeteras</button>
    <button id="navLogs" class="nav-btn" onclick="mostrarVista('logs')">🧾 Logs</button>

    <div class="card">
      <h4>Resumen</h4>
      <div id="sideResumen" class="small">Cargando...</div>
    </div>
  </aside>

  <main class="main">

    <section id="viewDashboard">
      <div class="card">
        <div class="row">
          <button class="secondary" onclick="refrescarTodo()">Refrescar todo</button>
        </div>

        <h2>Dashboard general</h2>
        <div id="dashboardStats" class="stat-grid"></div>
      </div>

      <div class="card">
        <h3>Últimas solicitudes</h3>
        <div id="tablaDashboardSolicitudes"></div>
      </div>
    </section>

    <section id="viewSolicitudes" class="hidden">
      <div class="card">
        <h2>Solicitudes</h2>
        <p class="small">ADMIN ve todas. ENCARGADO ve solo su PC.</p>

        <div class="grid">
          <div>
            <label>PC</label>
            <select id="filtroPc">
              <option value="">Todas</option>
              <option value="CHINO">CHINO</option>
              <option value="ALV">ALV</option>
              <option value="X">X</option>
              <option value="SAN">SAN</option>
              <option value="EYF">EYF</option>
            </select>
          </div>

          <div>
            <label>Tipo</label>
            <select id="filtroTipo">
              <option value="">Todos</option>
              <option value="CARGA">CARGA</option>
              <option value="RETIRO">RETIRO</option>
            </select>
          </div>

          <div>
            <label>Estado</label>
            <select id="filtroEstado">
              <option value="">Todos</option>
              <option value="PENDIENTE_PAGO">PENDIENTE_PAGO</option>
              <option value="PENDIENTE_APROBACION">PENDIENTE_APROBACION</option>
              <option value="APROBADA_MANUAL">APROBADA_MANUAL</option>
              <option value="RECHAZADA">RECHAZADA</option>
              <option value="PAGADA">PAGADA</option>
              <option value="ACREDITADA">ACREDITADA</option>
              <option value="ERROR">ERROR</option>
            </select>
          </div>
        </div>

        <button class="primary" onclick="cargarSolicitudes()">Buscar solicitudes</button>
        <div id="solicitudesMsg" class="msg"></div>
        <div id="tablaSolicitudes"></div>
      </div>
    </section>

    <section id="viewOperadores" class="hidden">
      <div class="card">
        <h2>Crear operador</h2>

        <div class="grid">
          <div><label>Nombre</label><input id="opNombre" placeholder="Nombre"></div>
          <div><label>Usuario</label><input id="opUsuario" placeholder="usuario"></div>
          <div><label>Clave</label><input id="opClave" placeholder="1234"></div>

          <div>
            <label>Rol</label>
            <select id="opRol">
              <option value="OPERADOR">OPERADOR</option>
              <option value="ENCARGADO">ENCARGADO</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>

          <div>
            <label>PC</label>
            <select id="opPc">
              <option value="CHINO">CHINO</option>
              <option value="ALV">ALV</option>
              <option value="X">X</option>
              <option value="SAN">SAN</option>
              <option value="EYF">EYF</option>
              <option value="TODAS">TODAS</option>
            </select>
          </div>

          <div>
            <label>Tipo operador</label>
            <select id="opTipoOperador">
              <option value="FIJO">FIJO</option>
              <option value="FRANQUERO">FRANQUERO</option>
            </select>
          </div>

          <div>
            <label>Turno</label>
            <select id="opTurno">
              <option value="FULL">FULL</option>
              <option value="TM">TM</option>
              <option value="TT">TT</option>
              <option value="TN">TN</option>
            </select>
          </div>
        </div>

        <h4>Permisos</h4>
        <div class="grid">
          <div><label>Elegir billetera</label><select id="opPermBilletera"><option>SI</option><option>NO</option></select></div>
          <div><label>Aprobar manual</label><select id="opPermAprobar"><option>SI</option><option>NO</option></select></div>
          <div><label>Rechazar</label><select id="opPermRechazar"><option>SI</option><option>NO</option></select></div>
          <div><label>Cambiar clave</label><select id="opPermClave"><option>SI</option><option>NO</option></select></div>
        </div>

        <button class="success" onclick="crearOperador()">Crear operador</button>
        <div id="operadoresMsg" class="msg"></div>
      </div>

      <div class="card">
        <h2>Operadores</h2>
        <button class="secondary" onclick="cargarConfig()">Actualizar</button>
        <div id="tablaOperadores"></div>
      </div>
    </section>

    <section id="viewBilleteras" class="hidden">
      <div class="card">
        <h2>Crear billetera</h2>

        <div class="grid">
          <div>
            <label>PC</label>
            <select id="bilPc">
              <option value="CHINO">CHINO</option>
              <option value="ALV">ALV</option>
              <option value="X">X</option>
              <option value="SAN">SAN</option>
              <option value="EYF">EYF</option>
            </select>
          </div>

          <div>
            <label>Tipo</label>
            <select id="bilTipo">
              <option value="MP_AUTO">MP_AUTO</option>
              <option value="MP_MANUAL">MP_MANUAL</option>
              <option value="NJX">NJX</option>
              <option value="BANCO">BANCO</option>
              <option value="OTRA">OTRA</option>
            </select>
          </div>

          <div><label>Nombre visible</label><input id="bilNombre" placeholder="ALTAMIRANO"></div>
          <div><label>Titular</label><input id="bilTitular" placeholder="Nombre titular"></div>
          <div><label>Alias</label><input id="bilAlias" placeholder="alias.mp"></div>
          <div><label>CVU / CBU</label><input id="bilCvu" placeholder="000000..."></div>

          <div><label>Validación</label><select id="bilValidacion"><option>AUTO</option><option>MANUAL</option></select></div>
          <div><label>Rotación</label><select id="bilRotacion"><option>SI</option><option>NO</option></select></div>
          <div><label>Saldo inicial</label><input id="bilSaldoInicial" type="number" value="0"></div>
          <div><label>Límite descarga</label><input id="bilLimite" type="number" value="0"></div>
          <div><label>Máx por día</label><input id="bilMaxDia" type="number" value="0"></div>
          <div><label>Máx por hora</label><input id="bilMaxHora" type="number" value="0"></div>
        </div>

        <button class="success" onclick="crearBilletera()">Crear billetera</button>
        <div id="billeterasMsg" class="msg"></div>
      </div>

      <div class="card">
        <h2>Billeteras</h2>
        <button class="secondary" onclick="cargarConfig()">Actualizar</button>
        <div id="tablaBilleteras"></div>
      </div>
    </section>

    <section id="viewLogs" class="hidden">
      <div class="card">
        <h2>Logs</h2>

        <div class="grid">
          <div>
            <label>PC</label>
            <select id="logPc">
              <option value="">Todas</option>
              <option value="CHINO">CHINO</option>
              <option value="ALV">ALV</option>
              <option value="X">X</option>
              <option value="SAN">SAN</option>
              <option value="EYF">EYF</option>
            </select>
          </div>
        </div>

        <button class="primary" onclick="cargarLogs()">Cargar logs</button>
        <div id="logsMsg" class="msg"></div>
        <div id="tablaLogs"></div>
      </div>
    </section>

  </main>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyY5y_iUlHhKiGOzRZebwobkHIFmgXfKPDidS3tx3gXJhCrNvHQC79csQsgQPDqz_w/exec";

let admin = JSON.parse(localStorage.getItem("admin_core_v2") || "null");
let config = { operadores: [], billeteras: [], pcs: [] };
let solicitudes = [];

window.onload = () => {
  if (admin) mostrarApp();
};

async function api(params) {
  const url = API_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  const text = await res.text();

  try { return JSON.parse(text); }
  catch (e) {
    console.error(text);
    return { ok:false, error:"Respuesta inválida de API" };
  }
}

function msg(id, text, ok = null) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = text || "";
  if (ok === true) el.className = "okBox";
  else if (ok === false) el.className = "errBox";
  else el.className = "msg";
}

async function login() {
  const usuario = document.getElementById("loginUsuario").value.trim();
  const clave = document.getElementById("loginClave").value.trim();

  if (!usuario || !clave) {
    msg("loginMsg", "Completá usuario y clave.", false);
    return;
  }

  const r = await api({ action:"login", usuario, clave });

  if (!r.ok) {
    msg("loginMsg", r.error || "Error de login.", false);
    return;
  }

  const rol = String(r.operador.rol || "").toUpperCase();
  if (rol !== "ADMIN" && rol !== "ENCARGADO") {
    msg("loginMsg", "Este panel es solo para ADMIN o ENCARGADO.", false);
    return;
  }

  admin = r.operador;
  localStorage.setItem("admin_core_v2", JSON.stringify(admin));
  mostrarApp();
}

function mostrarApp() {
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");

  document.getElementById("adminBox").innerHTML = `
    <span class="badge"><b>${admin.nombre}</b></span>
    <span class="badge">Rol: ${admin.rol}</span>
    <span class="badge">PC: ${admin.pc}</span>
  `;

  if (admin.rol === "ENCARGADO") {
    limitarSelectsEncargado();
  }

  refrescarTodo();
}

function limitarSelectsEncargado() {
  ["filtroPc","opPc","bilPc","logPc"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<option value="${admin.pc}">${admin.pc}</option>`;
    el.value = admin.pc;
  });

  const rol = document.getElementById("opRol");
  if (rol) {
    rol.innerHTML = `
      <option value="OPERADOR">OPERADOR</option>
      <option value="ENCARGADO">ENCARGADO</option>
    `;
  }
}

function cerrarSesion() {
  localStorage.removeItem("admin_core_v2");
  admin = null;
  location.reload();
}

function mostrarVista(vista) {
  ["Dashboard","Solicitudes","Operadores","Billeteras","Logs"].forEach(v => {
    document.getElementById("view" + v).classList.add("hidden");
    document.getElementById("nav" + v).classList.remove("active");
  });

  const cap = vista.charAt(0).toUpperCase() + vista.slice(1);
  document.getElementById("view" + cap).classList.remove("hidden");
  document.getElementById("nav" + cap).classList.add("active");
}

async function refrescarTodo() {
  await cargarConfig();
  await cargarSolicitudes();
  await cargarLogs(false);
  renderDashboard();
}

async function cargarConfig() {
  const r = await api({ action:"getconfig", usuario:admin.usuario });
  if (!r.ok) return;

  config = r;
  renderOperadores();
  renderBilleteras();
}

function estadoBadge(estado) {
  const e = String(estado || "");
  if (["APROBADA_MANUAL","ACREDITADA","PAGADA"].includes(e)) return `<span class="badge badge-ok">${e}</span>`;
  if (["RECHAZADA","ERROR"].includes(e)) return `<span class="badge badge-danger">${e}</span>`;
  return `<span class="badge badge-warn">${e}</span>`;
}

async function cargarSolicitudes() {
  const pc = document.getElementById("filtroPc")?.value || "";
  const tipoSolicitud = document.getElementById("filtroTipo")?.value || "";
  const estado = document.getElementById("filtroEstado")?.value || "";

  msg("solicitudesMsg", "Cargando solicitudes...");

  const r = await api({
    action:"listarsolicitudes",
    usuario:admin.usuario,
    pc,
    tipoSolicitud,
    estado
  });

  if (!r.ok) {
    msg("solicitudesMsg", r.error || "No se pudieron cargar solicitudes.", false);
    return;
  }

  solicitudes = r.solicitudes || [];
  msg("solicitudesMsg", `Solicitudes encontradas: ${solicitudes.length}`, true);
  renderSolicitudes();
  renderDashboard();
}

function renderSolicitudes() {
  let html = `
    <table>
      <thead>
        <tr>
          <th>Fecha</th><th>Tipo</th><th>PC</th><th>Usuario</th><th>Nombre</th>
          <th>Monto</th><th>Billetera</th><th>Estado</th><th>Operador</th>
        </tr>
      </thead><tbody>
  `;

  solicitudes.slice().reverse().forEach(s => {
    html += `
      <tr>
        <td>${s.FECHA_CREACION || ""}</td>
        <td>${s.TIPO_SOLICITUD || ""}</td>
        <td>${s.PC || ""}</td>
        <td><b>${s.USUARIO || ""}</b></td>
        <td>${s.NOMBRE_COMPLETO || ""}</td>
        <td>Declarado: $${s.MONTO_DECLARADO || ""}<br>Real: $${s.MONTO_REAL || ""}</td>
        <td>${s.BILLETERA_NOMBRE || ""}<br><span class="small">${s.METODO_BILLETERA || ""}</span></td>
        <td>${estadoBadge(s.ESTADO)}<br><span class="small">${s.VERIFICACION || ""}</span></td>
        <td>Tomó: ${s.QUIEN_TOMO || "-"}<br>Aprobó: ${s.QUIEN_APROBO || "-"}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById("tablaSolicitudes").innerHTML = html;
}

function renderDashboard() {
  const ops = config.operadores || [];
  const bills = config.billeteras || [];
  const pcSet = new Set();

  ops.forEach(o => { if (o.PC && o.PC !== "TODAS") pcSet.add(o.PC); });
  bills.forEach(b => { if (b.PC) pcSet.add(b.PC); });

  const pendientes = solicitudes.filter(s => String(s.ESTADO || "").includes("PENDIENTE")).length;
  const aprobadas = solicitudes.filter(s => ["APROBADA_MANUAL","ACREDITADA","PAGADA"].includes(String(s.ESTADO))).length;
  const rechazadas = solicitudes.filter(s => ["RECHAZADA","ERROR"].includes(String(s.ESTADO))).length;

  document.getElementById("dashboardStats").innerHTML = `
    <div class="stat"><div class="stat-num">${pcSet.size}</div><div class="small">PCs</div></div>
    <div class="stat"><div class="stat-num">${ops.length}</div><div class="small">Operadores activos</div></div>
    <div class="stat"><div class="stat-num">${bills.length}</div><div class="small">Billeteras activas</div></div>
    <div class="stat"><div class="stat-num">${pendientes}</div><div class="small">Pendientes</div></div>
    <div class="stat"><div class="stat-num">${aprobadas}</div><div class="small">Aprobadas/pagadas</div></div>
    <div class="stat"><div class="stat-num">${rechazadas}</div><div class="small">Rechazadas/error</div></div>
  `;

  document.getElementById("sideResumen").innerHTML = `
    PC: <b>${admin.pc}</b><br>
    Operadores: <b>${ops.length}</b><br>
    Billeteras: <b>${bills.length}</b><br>
    Solicitudes: <b>${solicitudes.length}</b>
  `;

  let ultimas = solicitudes.slice().reverse().slice(0, 8);
  let html = `<table><thead><tr><th>Fecha</th><th>PC</th><th>Usuario</th><th>Monto</th><th>Estado</th></tr></thead><tbody>`;
  ultimas.forEach(s => {
    html += `<tr><td>${s.FECHA_CREACION || ""}</td><td>${s.PC || ""}</td><td>${s.USUARIO || ""}</td><td>$${s.MONTO_DECLARADO || ""}</td><td>${estadoBadge(s.ESTADO)}</td></tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById("tablaDashboardSolicitudes").innerHTML = html;
}

function renderOperadores() {
  const ops = config.operadores || [];

  let html = `
    <table>
      <thead><tr>
        <th>Nombre</th><th>Usuario</th><th>Rol</th><th>PC</th><th>Tipo</th><th>Turno</th><th>Permisos</th>
      </tr></thead><tbody>
  `;

  ops.forEach(o => {
    html += `
      <tr>
        <td>${o.NOMBRE || ""}</td>
        <td>${o.USUARIO || ""}</td>
        <td>${o.ROL || ""}</td>
        <td>${o.PC || ""}</td>
        <td>${o.TIPO_OPERADOR || ""}</td>
        <td>${o.TURNO || ""}</td>
        <td>
          Billetera: ${o.PUEDE_ELEGIR_BILLETERA || ""}<br>
          Aprobar: ${o.PUEDE_APROBAR_MANUAL || ""}<br>
          Rechazar: ${o.PUEDE_RECHAZAR || ""}<br>
          Clave: ${o.PUEDE_CAMBIAR_CLAVE || ""}
        </td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById("tablaOperadores").innerHTML = html;
}

function renderBilleteras() {
  const bills = config.billeteras || [];

  let html = `
    <table>
      <thead><tr>
        <th>Nombre</th><th>PC</th><th>Tipo</th><th>Alias/CVU</th><th>Saldo</th><th>Estado</th>
      </tr></thead><tbody>
  `;

  bills.forEach(b => {
    const activa = String(b.ACTIVA || "").toUpperCase() === "SI";
    const enUso = String(b.SELECCIONADA_MANUAL || "").toUpperCase() === "SI";

    html += `
      <tr>
        <td><b>${b.NOMBRE_VISIBLE || ""}</b><br>${b.TITULAR || ""}</td>
        <td>${b.PC || ""}</td>
        <td>${b.TIPO || ""}<br>${b.VALIDACION || ""}</td>
        <td>${b.ALIAS || ""}<br>${b.CVU_CBU || ""}</td>
        <td>Estimado: $${b.SALDO_ESTIMADO || 0}<br>Real: $${b.SALDO_REAL || 0}<br>Límite: $${b.LIMITE_DESCARGA || 0}</td>
        <td>
          ${activa ? '<span class="badge badge-ok">ACTIVA</span>' : '<span class="badge badge-danger">INACTIVA</span>'}
          ${enUso ? '<span class="badge badge-warn">EN USO</span>' : ''}
        </td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById("tablaBilleteras").innerHTML = html;
}

async function cargarLogs(showMsg = true) {
  const pc = document.getElementById("logPc")?.value || "";

  if (showMsg) msg("logsMsg", "Cargando logs...");

  const r = await api({ action:"listarlogs", usuario:admin.usuario, pc });

  if (!r.ok) {
    if (showMsg) msg("logsMsg", r.error || "No se pudieron cargar logs.", false);
    return;
  }

  const logs = r.logs || [];
  if (showMsg) msg("logsMsg", `Logs encontrados: ${logs.length}`, true);

  let html = `<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Usuario</th><th>PC</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>`;

  logs.forEach(l => {
    html += `
      <tr>
        <td>${l.FECHA || ""}</td>
        <td>${l.TIPO || ""}</td>
        <td>${l.USUARIO || ""}</td>
        <td>${l.PC || ""}</td>
        <td>${l.ACCION || ""}</td>
        <td>${l.DETALLE || ""}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById("tablaLogs").innerHTML = html;
}
</script>
</body>
</html>
